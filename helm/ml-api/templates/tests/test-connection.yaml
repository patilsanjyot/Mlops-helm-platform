apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ml-api.fullname" . }}-test"
  labels:
    {{- include "ml-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.10.1
      command:
        - curl
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "ml-api.fullname" . }}:{{ .Values.service.port }}/health